<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horr0r Qu)z</title>
<style>
/* Базові налаштування */
body {
    font-family:  Comic Sans MS;
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: cyan;
}

#answers-container{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.answer-btn{
    padding: 10px 20px;
    border-radius: 5px;
    border: white;
    cursor: pointer;
    width: 48%;
    background-color: black;
    color: cyan;
    box-sizing: border-box;
    min-height: 44px;
}
.answer-btn:hover{
    background-color: cyan
    ;
    color: black;
}


.hide{
    display: none;
}

.correct{
    background-color: rgb(0, 90, 0);
    color: white;
}

.wrong{
    background-color: rgb(190, 0, 0);
    color: white;
}
#start-btn, #restart-btn{
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    background-color: #000000;
    color: cyan;
}

.header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
</style>
</head>
<body>

<div class="app-container">
    <div id="start-screen" class="screen">
        <h2>Horr0r Qu)z</h2>
        <button id="start-btn">        / </button>
    </div>
    <div id="quiz-screen" class="screen hide">
        <div class="header">
            <span id="timer">Час: 15с</span>
            <span id="score-display">Бали: 0</span>
        </div>
        <h2 id="question-text">Запитання 1</h2>
        <div id="answers-container"></div>
    </div>
    <div id="result-screen" class="screen hide">
        <h2>Гру завершено!</h2>
        <p class="result-text"></p>
        <button id="restart-btn">Спробувати ще</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {


const questions = [
        {
            question: "Як гладити кота правильно?",
            answers: ["за шерстю", "проти шерсті", "вертикально", "за годинниковою стрілкою"],
            correct: 0
        },
        {
            question: "як гладити кота?",
            answers: ["за шерстю", "під час обіду", "завтра", "коли він спить"],
            correct: 0
        },
        {
            question: "ЯКе було минуле запитання?",
            answers: ["Який тип даних є числом в JS", "Як гладити кота", "Що треба робити при пожежі?", "Нічого"],
            correct: 1
        },
        {
            question: "яки питання на вашу думку сюди підійшло?",
            answers: ["", "", "", "питання про кота"],
            correct: 3
        },
        {
            question: "скільки разів в день треба годувати кота?",
            answers: ["67", "-9", "1", "3"],
            correct: 3
        },
         {
            question: "я не знаю про що запитати?",
            answers: ["", "", "", "?"],
            correct: 3
        },
          {
            question: "тож як гладити кота правильно?",
            answers: ["згадуйте відповідь", "згадуйте відповідь", "згадуйте відповідь", "згадуйте відповідь"],
            correct: 0
        },
        {
            question: "яке було друге питання всього квізу?",
            answers: ["тож як гладити кота правильно?", "як гладити кота", "як гладити кота?", "коли він спить"],
            correct: 2
        },
        {
            question: "ЯКе було минуле запитання?",
            answers: ["Який тип даних є числом в JS", "Як гладити кота", "Що треба робити при пожежі?", "Нічого"
            ,"тож як гладити кота правильно?", "як гладити кота", "як гладити кота?", "коли він спить"],
            correct: 3
        },
        {
            question: "вам подобається цей квіз?",
            answers: ["т_к", "_ак", "__к", "та_","т_к", "_ак", "__к", "та_","т_к", "_ак", "__к", "та_"],
            correct: 6
        },
        {
            question: "ви хочете продовжити квіз?",
            answers: ["я не знаю", "?", "так", "ні"],
            correct: 2
        },
         {
            question: "чи це останнє питання?",
            answers: ["ні", "ні", "ні", "ні"],
            correct: 100
        },
    ];

    const startScreen = document.querySelector('#start-screen');
    const quizScreen = document.querySelector('#quiz-screen');
    const resultScreen = document.querySelector('#result-screen');

    const startBtn = document.querySelector('#start-btn');
    const restartBtn = document.querySelector('#restart-btn');

    const resultText = document.querySelector('.result-text');

    const questionText = document.querySelector('#question-text');
    const answersContainer = document.querySelector('#answers-container');
    const scoreDisplay = document.querySelector('#score-display');
    let questionIndex = 0;
    let score = 0;
    let timer = 15;
    const timerDisplay = document.querySelector('#timer');
    let interval;


    function updateScore() {
        scoreDisplay.innerText = `Бали: ${score}`;
    }

    function showQuestion(question) {

        clearInterval(interval);
        startTimer();

        answersContainer.innerHTML = '';
        questionText.innerText = question.question;
        for (let i = 0; i < question.answers.length; i++) {
            const button = document.createElement('button');
            button.innerText = question.answers[i];
            button.classList.add('answer-btn');
            button.addEventListener('click', () => checkAnswer(button, i));
            answersContainer.appendChild(button);

        }
    }

    function nextQuestion() {
        questionIndex++;
        if (questionIndex < questions.length) {
            showQuestion(questions[questionIndex]);
        } else {
            showResult();
        }
    }

    // clearInterval(interval); startTimer(); showResult();
    function checkAnswer(button, i){
        const correctIndex = questions[questionIndex].correct;
        const allButtons = document.querySelectorAll('.answer-btn');

        if (i == correctIndex) {
            score++;
            button.classList.add('correct');
        } else {
            button.classList.add('wrong');
            if (correctIndex >= 0 && correctIndex < allButtons.length) {
                allButtons[correctIndex].classList.add('correct');
            }
        }

        updateScore();

        allButtons.forEach(btn => {
            btn.disabled = true;
        });
        setTimeout(nextQuestion, 1000);
    }

    function startGame() {
        startScreen.classList.add('hide');
        resultScreen.classList.add('hide');
        quizScreen.classList.remove('hide');
        questionIndex = 0;
        score = 0;
        updateScore();
        showQuestion(questions[questionIndex]);
    }

    startBtn.addEventListener('click', startGame);

    function showResult() {
        const accuracy = Math.round((score / questions.length) * 100);
        resultText.innerText = `Твій результат: ${score}/${questions.length} (${accuracy}%)`;
        quizScreen.classList.add('hide');
        resultScreen.classList.remove('hide');
        const finalScore = document.querySelector('#final-score');
        finalScore.innerText = score;
    }

    function startTimer() {
        timer = 15;
        timerDisplay.innerText = `Час: ${timer}с`;
        interval = setInterval(() => {
            timer--;
            timerDisplay.innerText = `Час: ${timer}с`;
            if (timer <= 0) {
                clearInterval(interval);
                nextQuestion();
            }
        }, 1000);
    }

    restartBtn.addEventListener('click', () => {
        startGame();
        resultScreen.classList.add('hide');
    });



});
</script>

</body>
</html>
